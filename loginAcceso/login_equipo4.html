<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link href="estilos_equipo4.css" rel="stylesheet">
</head>

<body>
  <header>
    <a href="https://www.ipn.mx/" target="_blank"><img src="imgs/ipn.png" alt="Logo ipn"
        style="width: 100px; height: auto; float: left">
    </a>
    <img src="imgs/logo_equipo4.jpg" alt="logo equipo" style="width: 100px; height: auto; float: right">
  </header>
  <main>
    <div class="container">
      <form action="bienvenida.html" target="_blank">
        <h1> Acceso al sistema:</h1>
        <label for="username">Usuario:</label>
        <input type="text" id="username" name="username" required placeholder="Ingrese su usuario" maxlength="20">
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" required placeholder="Ingrese su contraseña"
          maxlength="20"><br>
        <button type="submit">Ingresar</button>
      </form>
    </div>
  </main>
  <footer>
    <p>&copy TDAW-4CM5-E4 </p>
    <a href="https://www.escom.ipn.mx/" target="_blank"><img src="imgs/logo_escom.png" alt="Logo tec"
        style="width: 101px;  float: left"></a>
  </footer>
</body>

</html>
