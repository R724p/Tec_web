<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link href="estilos_equipo4.css" rel="stylesheet">
</head>

<body>
  <header>
    <img src="imgs/ipn.png" alt="Logo ipn" style="width: 100px; height: auto; float: left">
    <img src="imgs/logo_equipo4.jpg" alt="logo equipo" style="width: 100px; height: auto; float: right">
  </header>
  <main>
    <div class="container">
      <form action="bienvenida.html" target="_blank">
        <h1> ACceso al sistema:</h1>
        <img src="imgs/user.jpg" alt="Logo equipo" style="width: 100px; height: auto; display: block; margin: 0 auto;">
        <label for="username">Usuario:</label>
        <input type="text" id="username" name="username" required placeholder="Ingrese su usuario" maxlength="20">
        <img src="imgs/key.jpeg" alt="Logo equipo" style="width: 100px; height: auto; display: block; margin: 0 auto;">
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" required placeholder="Ingrese su contraseña"
          maxlength="20"><br>
        <button type="submit">Ingresar</button>
      </form>
    </div>
  </main>
  <footer>
    <img src="imgs/logo_escom.png" alt="Logo tec" style="width: 101px; height: 55px; float: left">
    <p>&copy TDAW-4CM5-Ex </p>
  </footer>
</body>

</html>
